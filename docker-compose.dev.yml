services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    ports:
      - "5432:5432"    # 開發時需要直接訪問資料庫
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parkAlert
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data   # 開發環境專用的 volume

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"      # 開發時需要 pgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

  startup-message:
    image: alpine
    command: |
      sh -c '
      echo "=================================================";
      echo "🚀 開發環境啟動中...";
      echo "✨ 服務資訊：";
      echo "   - API 服務: 請自行安裝 Node 環境啟動;
      echo "   - 資料庫: localhost:5432";
      echo "   - pgAdmin: http://localhost:5050";
      echo "=================================================";
      '
    depends_on:
      - postgres
      - pgadmin

volumes:
  postgres_data_dev:
